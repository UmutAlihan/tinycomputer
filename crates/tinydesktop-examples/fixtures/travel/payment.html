<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SkyFare · Payment</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <h1>Payment</h1>
  <p>Total: ₹6,840</p>
  <form onsubmit="event.preventDefault(); document.body.dataset.paid = 'yes';">
    <label for="card">Card number</label>
    <input id="card" name="card" autocomplete="cc-number" inputmode="numeric">
    <label for="expiry">Expiry date</label>
    <input id="expiry" name="expiry" autocomplete="cc-exp">
    <label for="cvv">CVV</label>
    <input id="cvv" name="cvv" autocomplete="cc-csc">
    <button type="submit">Pay ₹6,840</button>
  </form>
</main>
</body>
</html>
