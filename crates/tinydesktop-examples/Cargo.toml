[package]
name = "tinydesktop-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runnable examples and live verification harnesses for tinydesktop."
publish = false

[dependencies]
tinydesktop = { path = "../tinydesktop" }
tinydesktop-bus = { workspace = true }
tinybus = { workspace = true, features = ["modules"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# The optional multimodal author the lab puts in front of Jev: an LLM that
# writes flows from a brief and checks screenshots. Lab-only on purpose — the
# shipped module stays Jev-only and never links it. Vendored as the
# `vendor/tinyinference` submodule and pinned by its gitlink.
tinyinference-llm = { workspace = true, optional = true }

[features]
default = ["inference"]
# `lab --mode authored`: an LLM writes the flow from the scenario brief.
inference = ["dep:tinyinference-llm"]

[lints]
workspace = true
