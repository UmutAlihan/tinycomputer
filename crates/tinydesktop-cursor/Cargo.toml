[package]
name = "tinydesktop-cursor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The agent's on-screen cursor: where it aims on an element and the human path it glides along, planned deterministically for a renderer to draw."
documentation = "https://docs.rs/tinydesktop-cursor"
readme = "README.md"
keywords = ["automation", "cursor", "overlay", "animation"]
categories = ["os"]
publish = false

[dependencies]
# `CursorPace` is read from module configuration.
serde = { workspace = true }
# Derive macros for the crate-wide error type in `src/error/`.
thiserror = { workspace = true }
# Seeds an unseeded cursor, so two runs never trace the same path.
getrandom = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
