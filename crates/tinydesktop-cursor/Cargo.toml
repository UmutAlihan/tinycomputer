[package]
name = "tinydesktop-cursor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The agent's on-screen cursor, shared by the desktop and browser: where it aims, the human path it glides along, how it looks, and the protocol to the overlay that draws it."
documentation = "https://docs.rs/tinydesktop-cursor"
readme = "README.md"
keywords = ["automation", "cursor", "overlay", "animation"]
categories = ["os"]
publish = false

[dependencies]
# `CursorPace` is read from module configuration.
serde = { workspace = true }
# Derive macros for the crate-wide error type in `src/error/`.
thiserror = { workspace = true }
# The overlay protocol: one JSON command per line.
serde_json = { workspace = true }
# Seeds an unseeded cursor, so two runs never trace the same path.
getrandom = { workspace = true }

[lints]
workspace = true
