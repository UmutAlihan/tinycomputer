[package]
name = "tinydesktop-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser automation over the agent-browser engine: typed sessions, snapshots, actions, and output handles, with no bus and no agent loop."
documentation = "https://docs.rs/tinydesktop-browser"
readme = "README.md"
keywords = ["browser", "automation", "cdp", "accessibility"]
categories = ["web-programming"]
publish = false

[dependencies]
# The browser interface's payload types, re-exported so
# `tinydesktop_browser::Action` is the contract type.
tinydesktop-bus = { workspace = true }
# Derive macros for the crate-wide error type in `src/error/`.
thiserror = { workspace = true }
# Commands and replies cross into the engine as JSON.
serde_json = { workspace = true }
# Unguessable held-output identities.
getrandom = { workspace = true }
# Held outputs are handed out as base64 chunks and fingerprinted by SHA-256.
base64 = { workspace = true }
sha2 = { workspace = true }
# The surface trait and screen model `BrowserSurface` implements, and the
# platform keymap.
tinydesktop-core = { workspace = true }
# Per-session locks held across engine calls; `rt` for the runtime handle a
# blocking surface call runs the async browser on.
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
